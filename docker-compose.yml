# =============================================================================
# ScanbonAI – Docker Compose (Dokploy-compatible)
# =============================================================================
# Usage (local):
#   cp .env.example .env          # fill in real values
#   docker compose up -d
#   docker compose exec api python -m app.scripts.seed_demo
#
# Usage (Dokploy):
#   Paste this file into a new Compose application.
# =============================================================================

name: scanbonai

# ---------------------------------------------------------------------------
# Shared extension anchors
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &on-failure
  restart: on-failure

x-api-build: &api-build
  build:
    context: ./backend
    dockerfile: Dockerfile

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # --------------------------------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    <<: *on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scanbonai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-scanbonai}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanbonai} -d ${POSTGRES_DB:-scanbonai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Redis 7
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *on-failure
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging

  # --------------------------------------------------------------------------
  # FastAPI backend
  # --------------------------------------------------------------------------
  api:
    <<: [*api-build, *on-failure]
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --loop uvloop
      --no-access-log
    env_file:
      - .env
    environment:
      STORAGE_PATH: /data/invoices
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - invoice_data:/data/invoices
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend
      - frontend
      - openclaw
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Celery worker
  # --------------------------------------------------------------------------
  worker:
    <<: [*api-build, *on-failure]
    command: >
      celery -A app.workers worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=100
    env_file:
      - .env
    environment:
      STORAGE_PATH: /data/invoices
    volumes:
      - invoice_data:/data/invoices
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - frontend  # needs internet for DeepSeek OCR + WhatsApp API
      - openclaw
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

  # --------------------------------------------------------------------------
  # React / Vite frontend
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    <<: *on-failure
    ports:
      - "0.0.0.0:3001:3000"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging: *default-logging

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
  openclaw:
    external: true
    name: scanbonai-openclaw

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  invoice_data:
