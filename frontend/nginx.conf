# =============================================================================
# ScanbonAI – Frontend Nginx config (SPA + /api proxy)
# =============================================================================
# This config is used inside the `frontend` container only.
# The public-facing TLS termination and routing live in nginx/nginx.conf
# (the `proxy` service).
# =============================================================================

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Gzip compression for static assets
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # --------------------------------------------------------------------------
    # Static asset caching
    # --------------------------------------------------------------------------
    # Immutable hash-named bundles (Vite adds content hashes to filenames)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # API proxy – forward /api/* to the FastAPI backend
    # Uses Docker DNS resolver with 30s TTL to survive container restarts.
    # --------------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://api:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Webhook + health endpoints
    location /hook/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://api:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        resolver 127.0.0.11 valid=30s;
        set $backend http://api:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
    }

    # Webhooks for billing (Stripe)
    location /webhooks/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://api:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # SPA fallback – all unknown routes return index.html so React Router works
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers for the SPA shell
        add_header X-Content-Type-Options "nosniff"   always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # Block hidden files (.env, .git, etc.)
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
