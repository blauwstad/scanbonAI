# =============================================================================
# ScanbonAI – Main Reverse Proxy (proxy service / public-facing Nginx)
# =============================================================================
# Handles:
#   - HTTP -> HTTPS permanent redirect
#   - TLS termination (Let's Encrypt certs provisioned via Dokploy Domains tab)
#   - Routing: /api and /hook  -> api:8000
#              /               -> frontend:3000
#   - Rate limiting zones
#   - Security headers
#   - Gzip compression
# =============================================================================

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # -----------------------------------------------------------------------
    # MIME types
    # -----------------------------------------------------------------------
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # -----------------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;   # hide Nginx version string

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        image/svg+xml
        font/woff2
        application/wasm;

    # -----------------------------------------------------------------------
    # Rate limiting zones
    # -----------------------------------------------------------------------
    # Webhook ingestion – stricter (WhatsApp sends bursts then backs off)
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/m;

    # General API – authenticated endpoints (per IP)
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

    # Auth endpoints – aggressive limiting to slow brute-force
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Frontend assets – generous limit
    limit_req_zone $binary_remote_addr zone=frontend:10m rate=300r/m;

    limit_req_status 429;

    # -----------------------------------------------------------------------
    # Upstream definitions
    # -----------------------------------------------------------------------
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:3000;
        keepalive 16;
    }

    # -----------------------------------------------------------------------
    # Security headers map – applied per location
    # -----------------------------------------------------------------------
    map $sent_http_content_type $csp_header {
        ~*text/html
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';";
        default "";
    }

    # -----------------------------------------------------------------------
    # HTTP -> HTTPS redirect (port 80)
    # -----------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge for Let's Encrypt renewal (Dokploy manages this)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS server
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        # -------------------------------------------------------------------
        # Replace YOUR_DOMAIN with your actual domain.
        # Dokploy auto-provisions certs via the Domains tab; the paths below
        # match the standard Let's Encrypt directory layout.
        # -------------------------------------------------------------------
        server_name YOUR_DOMAIN;

        # SSL certificates (managed by Dokploy / Certbot)
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        # -------------------------------------------------------------------
        # Modern TLS configuration
        # -------------------------------------------------------------------
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        # -------------------------------------------------------------------
        # Security headers – applied globally on this vhost
        # -------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                  always;
        add_header X-Content-Type-Options    "nosniff"                                     always;
        add_header X-XSS-Protection          "1; mode=block"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"             always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"    always;
        add_header Content-Security-Policy   $csp_header                                   always;

        # -------------------------------------------------------------------
        # Request size limits
        # -------------------------------------------------------------------
        client_max_body_size 15M;   # must exceed MAX_IMAGE_SIZE_MB (10 MB)
        client_body_timeout  30s;
        client_header_timeout 10s;

        # -------------------------------------------------------------------
        # Proxy common settings (shared across locations)
        # -------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # -------------------------------------------------------------------
        # Auth endpoints – extra rate limiting
        # -------------------------------------------------------------------
        location ~* ^/api/v[0-9]+/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://api_backend;
        }

        # -------------------------------------------------------------------
        # WhatsApp webhook receiver
        # -------------------------------------------------------------------
        location /hook {
            limit_req zone=webhook burst=20 nodelay;

            proxy_pass         http://api_backend;
            proxy_read_timeout 30s;
        }

        # -------------------------------------------------------------------
        # REST API
        # -------------------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://api_backend;

            # Long-running OCR jobs may take > 60 s
            proxy_read_timeout 180s;
        }

        # -------------------------------------------------------------------
        # Static frontend SPA
        # -------------------------------------------------------------------
        location / {
            limit_req zone=frontend burst=100 nodelay;

            proxy_pass http://frontend_app;

            # Cache-Control forwarded from the frontend nginx
            proxy_cache_bypass $http_cache_control;
        }

        # -------------------------------------------------------------------
        # Block hidden files and sensitive paths
        # -------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|git|sql|sh|bak)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
